<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hebrew Calendar</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icon.svg" alt="" width="30" height="30">
      <span>Hebrew Calendar</span>
    </div>
    <nav class="month-nav" aria-label="Month">
      <button class="icon-btn" id="prev" title="Previous month (Page Up)" aria-label="Previous month">‹</button>
      <button class="pill" id="today" title="Today (T)">Today</button>
      <button class="icon-btn" id="next" title="Next month (Page Down)" aria-label="Next month">›</button>
    </nav>
    <div class="titles">
      <h1 id="month-title">&nbsp;</h1>
      <div class="subtitle"><span id="hebrew-span"></span> <span class="he" id="hebrew-span-he" dir="rtl"></span></div>
    </div>
    <div class="actions">
      <button class="pill place" id="place-btn" title="Place and settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <span id="place-name">Choose a place</span>
      </button>
      <button class="icon-btn" id="goto-btn" title="Go to a date (G)" aria-label="Go to a date">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="calendar" aria-label="Calendar">
      <div class="weekdays" aria-hidden="true">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="sat">Shabbat</div>
      </div>
      <div class="grid" id="grid" role="grid" aria-label="Days of the month"></div>
      <p class="legend">
        <span class="chip yom_tov">Festival</span>
        <span class="chip chol_hamoed">Chol HaMoed</span>
        <span class="chip fast">Fast</span>
        <span class="chip minor">Minor</span>
        <span class="chip modern">Israeli</span>
        <span class="chip special_shabbat">Special Shabbat</span>
        <span class="chip rosh_chodesh">Rosh Chodesh</span>
        <span class="keys">← → days · ↑ ↓ weeks · PgUp PgDn months · T today · G go to</span>
      </p>
    </section>

    <aside class="detail" id="detail" aria-live="polite"></aside>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet">
      <h2 id="settings-title">Place and settings</h2>

      <label class="field">
        <span>Place</span>
        <select id="city"></select>
      </label>
      <button type="button" class="link" id="locate">Use my current location</button>

      <fieldset class="custom" id="custom">
        <legend>Custom place</legend>
        <label class="field"><span>Name</span><input id="c-name" autocomplete="off" placeholder="My town"></label>
        <div class="row">
          <label class="field"><span>Latitude</span><input id="c-lat" inputmode="decimal" placeholder="31.77"></label>
          <label class="field"><span>Longitude</span><input id="c-lng" inputmode="decimal" placeholder="35.21"></label>
        </div>
        <div class="row">
          <label class="field"><span>Time zone</span><input id="c-tz" list="zones" placeholder="Asia/Jerusalem"></label>
          <label class="field"><span>Elevation (m)</span><input id="c-elev" inputmode="decimal" placeholder="0"></label>
        </div>
        <datalist id="zones"></datalist>
      </fieldset>

      <div class="field">
        <span>Holidays and readings</span>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="observance" value="diaspora"> Outside Israel</label>
          <label><input type="radio" name="observance" value="israel"> Israel</label>
        </div>
      </div>

      <div class="row">
        <label class="field">
          <span>Candle lighting</span>
          <select id="candles">
            <option value="18">18 min before sunset</option>
            <option value="20">20 min before sunset</option>
            <option value="22">22 min before sunset</option>
            <option value="30">30 min before sunset</option>
            <option value="40">40 min (Jerusalem)</option>
          </select>
        </label>
        <label class="field">
          <span>Appearance</span>
          <select id="theme">
            <option value="auto">Match system</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>

      <p class="error" id="settings-error" role="alert"></p>
      <div class="buttons">
        <button value="cancel" class="pill" formnovalidate>Cancel</button>
        <button value="save" class="pill primary" id="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="goto" aria-labelledby="goto-title">
    <form method="dialog" class="sheet narrow">
      <h2 id="goto-title">Go to a date</h2>
      <label class="field"><span>Gregorian date</span><input type="date" id="g-date"></label>
      <div class="or">or</div>
      <div class="field">
        <span>Hebrew date</span>
        <div class="row three">
          <input id="h-day" inputmode="numeric" placeholder="Day" aria-label="Hebrew day">
          <select id="h-month" aria-label="Hebrew month"></select>
          <input id="h-year" inputmode="numeric" placeholder="Year" aria-label="Hebrew year">
        </div>
      </div>
      <p class="error" id="goto-error" role="alert"></p>
      <div class="buttons">
        <button value="cancel" class="pill" formnovalidate>Cancel</button>
        <button value="go" class="pill primary" id="go">Go</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
