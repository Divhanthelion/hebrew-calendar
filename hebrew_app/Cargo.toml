[package]
name = "hebrew_app"
version = "0.2.0"
edition = "2021"
description = "Hebrew calendar desktop app and web server"
license = "MIT"
repository = "https://github.com/Divhanthelion/hebrew-calendar"
default-run = "hebrew_app"

[[bin]]
name = "hebrew_app"
path = "src/main.rs"

[features]
default = ["gui", "server"]
gui = ["dep:tauri", "dep:tauri-build", "dep:windows-sys"]
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:serde_urlencoded"]

[dependencies]
hebrew_core = { path = "../hebrew_core" }
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"

tauri = { version = "2", features = [], optional = true }

axum = { version = "0.7", optional = true }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
serde_urlencoded = { version = "0.7", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"], optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
